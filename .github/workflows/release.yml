# Veröffentlicht auf npm, sobald ein Versions-Tag (v1.2.3) gepusht wird.
# Ablauf: npm version patch|minor|major  →  git push --follow-tags
#
# Anmeldung bei npm über Trusted Publishing (OIDC), kein Token im Repo.
# Einmalig auf npmjs.com einrichten: Paket → Settings → Trusted Publisher →
# GitHub Actions, Repository alexandercreates/localize-me, Workflow release.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub-Release anlegen
      id-token: write # Trusted Publishing + Provenance bei npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bewusst ohne npm-Cache: Ein Cache aus anderen Läufen soll nicht in die Veröffentlichung gelangen.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag und package.json müssen zusammenpassen
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($VERSION). Version mit 'npm version' setzen."
            exit 1
          fi
          if npm view "$(node -p "require('./package.json').name")@$VERSION" version >/dev/null 2>&1; then
            echo "::error::Version $VERSION ist auf npm schon veröffentlicht."
            exit 1
          fi

      # --ignore-scripts: keine Install-Skripte von Abhängigkeiten in einem Job mit Publish-Rechten.
      - run: npm ci --ignore-scripts

      - run: npm test

      # prepack baut die Oberfläche nach ui/
      - name: Auf npm veröffentlichen
        run: npm publish --provenance --access public

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
